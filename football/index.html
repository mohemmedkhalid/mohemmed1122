    // =====================================================================
    // 2. پێکهاتە (تەشکیلە)
    // =====================================================================
    function slotLayout(formation) {
        const rows = formation.split('-').map(Number);
        const res = [{ x: 50, y: 89, role: 'GK' }];
        const top = 16, bottom = 69, R = rows.length;
        rows.forEach((cnt, ri) => {
            const y = R === 1 ? (top + bottom) / 2 : bottom - ri * (bottom - top) / (R - 1);
            const role = ri === 0 ? 'DEF' : (ri === R - 1 ? 'FWD' : 'MID');
            for (let i = 0; i < cnt; i++) res.push({ x: (i + 0.5) * 100 / cnt, y, role });
        });
        return res;
    }

    // mode: 'edit' (پێکهاتە) | 'preview' (ئامادەکرنا یارییێ) | 'live' (یارییا ڕاستەوخۆ)
    function pitchHTML(formation, slots, mode, capId) {
        const layout = slotLayout(formation);
        let html = `<div class="pitch ${mode === 'preview' ? 'compact' : ''}">
            <div class="pl pl-out"></div><div class="pl pl-half"></div><div class="pl pl-circle"></div>
            <div class="pl pl-box top"></div><div class="pl pl-box bottom"></div>`;
        layout.forEach((pos, i) => {
            const pid = slots[i];
            const p = pid ? (mode === 'live' ? live.players[pid] : playerById(pid)) : null;
            const click = mode === 'edit' ? `onLineupSlot(${i})` : mode === 'live' ? `onLiveSlot(${i})` : `switchPage('lineup')`;
            const style = `left:${pos.x}%; top:${pos.y}%`;
            if (!p) {
                html += `<button class="slot empty r-${pos.role} ${benchPick && mode === 'edit' ? 'target' : ''}" style="${style}" onclick="${click}">
                    <span class="shirt">+</span><span class="slot-name">${esc(roleLabel(pos.role))}</span></button>`;
                return;
            }
            const absent = mode !== 'live' && !p.present;
            const goals = mode === 'live' ? (p.goals || 0) : 0;
            html += `<button class="slot r-${pos.role} ${absent ? 'absent' : ''} ${benchPick && mode === 'edit' ? 'target' : ''}" style="${style}" onclick="${click}">
                <span class="shirt">${esc(shirtText(p))}
                    ${capId === p.id ? capMark() : ''}
                    ${goals ? `<span class="goal-badge">⚽${goals > 1 ? goals : ''}</span>` : ''}
                </span>
                <span class="slot-name">${esc(p.name)}</span>
                ${mode === 'live' ? `<span class="slot-min" data-min="${p.id}">${fmtMin(playerSeconds(p))}</span>` : ''}
            </button>`;
        });
        return html + '</div>';
    }

    function formatSegHTML() {
        const f = getFormat();
        return [7, 8].map(n => `<button class="${f === n ? 'on' : ''}" onclick="setFormat(${n})"><b>${n} × ${n}</b><span>${esc(t('n_players', { n }))}</span></button>`).join('');
    }

    async function setFormat(n) {
        if (getFormat() === n) return;
        settings.format = String(n);
        benchPick = null;
        renderLineupPage(); renderMatchPage();
        try { await api('save_setting', { key: 'format', value: String(n) }); } catch (e) { showToast(t('save_error')); }
    }

    function curLineup() { return lineups[getFormat()] || { formation: FORMATIONS[getFormat()][0], slots: new Array(getFormat()).fill(null) }; }

    function renderLineupPage() {
        const n = getFormat();
        if (!lineups[n]) lineups[n] = curLineup();
        const lu = lineups[n];
        document.getElementById('formatSegLineup').innerHTML = formatSegHTML();
        document.getElementById('formationChips').innerHTML = FORMATIONS[n].map(f =>
            `<button class="chip-btn ${lu.formation === f ? 'on' : ''}" onclick="setFormation('${f}')">${f}</button>`).join('');

        const filled = lu.slots.filter(Boolean).length;
        document.getElementById('lineupFilled').textContent = `(${filled}/${n})`;

        const bp = benchPick ? playerById(benchPick) : null;
        document.getElementById('lineupBanner').innerHTML = bp
            ? `<div class="pick-banner"><span>${esc(t('place_banner', { name: bp.name }))}</span><button class="btn-sm btn-ghost" onclick="pickBench(${bp.id})">✖</button></div>`
            : `<div class="hint" style="margin-top:0">${esc(t('bench_hint'))}</div>`;

        document.getElementById('lineupPitch').innerHTML = pitchHTML(lu.formation, lu.slots, 'edit', captainId());

        const inLineup = new Set(lu.slots.filter(Boolean));
        const bench = presentPlayers().filter(p => !inLineup.has(p.id)).sort((a, b) => roleOrder(a.position) - roleOrder(b.position) || byNumberName(a, b));
        document.getElementById('lineupBenchCount').textContent = `(${bench.length})`;
        document.getElementById('lineupBench').innerHTML = bench.length ? bench.map(p => `
            <button class="bench-chip ${benchPick === p.id ? 'sel' : ''}" onclick="pickBench(${p.id})">
                ${numText(p) ? `<span class="n">${esc(numText(p))}</span>` : ''} ${esc(p.name)} ${captainId() === p.id ? capMark() : ''} ${roleChip(p.position)}
            </button>`).join('') : `<div class="empty-text" style="width:100%">${esc(t('bench_empty'))}</div>`;

        const absentIn = lu.slots.filter(Boolean).map(playerById).filter(p => p && !p.present);
        document.getElementById('lineupWarn').innerHTML = absentIn.length
            ? `<div class="warn-box">${esc(t('absent_in_lineup', { names: absentIn.map(p => p.name).join('، ') }))}</div>` : '';
    }

    function setFormation(f) {
        const n = getFormat();
        lineups[n].formation = f;
        persistLineup(n);
        renderLineupPage(); renderMatchPage();
    }

    function pickBench(id) {
        benchPick = benchPick === id ? null : id;
        renderLineupPage();
    }

    function onLineupSlot(i) {
        if (benchPick) {
            placePlayer(benchPick, i);
            benchPick = null;
            renderLineupPage();
            return;
        }
        openSlotPicker(i);
    }

    function openSlotPicker(i) {
        const n = getFormat();
        const lu = lineups[n];
        const layout = slotLayout(lu.formation);
        const role = layout[i].role;
        const current = lu.slots[i];
        const cands = presentPlayers().sort((a, b) => {
            const ra = a.position === role ? 0 : 1, rb = b.position === role ? 0 : 1;
            if (ra !== rb) return ra - rb;
            const ia = lu.slots.includes(a.id) ? 1 : 0, ib = lu.slots.includes(b.id) ? 1 : 0;
            if (ia !== ib) return ia - ib;
            return byNumberName(a, b);
        });
        let html = '';
        if (current) html += `<button class="btn-danger" style="margin-bottom:10px" onclick="removeFromSlot(${i})">${esc(t('remove_from_slot'))}</button>`;
        if (!cands.length) html += `<div class="empty-text">${esc(t('no_present'))}</div>`;
        html += '<div class="pick-list">' + cands.map(p => {
            const at = lu.slots.indexOf(p.id);
            const tag = p.id === current ? t('current') : (at >= 0 ? t('in_slot', { role: roleLabel(layout[at].role) }) : '');
            return `<button class="pick-row ${p.id === current ? 'cur' : ''}" onclick="placePlayer(${p.id}, ${i}); closeSheet();">
                <span class="num-badge">${esc(numText(p) || '–')}</span>
                <span class="pname">${esc(p.name)}</span>
                ${captainId() === p.id ? capMark() : ''}
                ${tag ? `<span class="tag">${esc(tag)}</span>` : ''}
                ${roleChip(p.position)}
            </button>`;
        }).join('') + '</div>';
        openSheet(t('pick_for_slot', { role: roleLabel(role) }), html);
    }

    function placePlayer(pid, i) {
        const n = getFormat();
        const lu = lineups[n];
        const prev = lu.slots.indexOf(pid);
        const occupant = lu.slots[i];
        if (prev === i) return;
        if (prev >= 0) lu.slots[prev] = occupant;   // گوهۆڕینا جهان د ناڤبەرا دوو یاریزانان دا
        lu.slots[i] = pid;
        persistLineup(n);
        renderLineupPage(); renderMatchPage();
    }

    function removeFromSlot(i) {
        const n = getFormat();
        lineups[n].slots[i] = null;
        persistLineup(n);
        closeSheet();
        renderLineupPage(); renderMatchPage();
    }

    function autoFillLineup() {
        const n = getFormat();
        const lu = lineups[n];
        const layout = slotLayout(lu.formation);
        lu.slots = lu.slots.map(id => (id && playerById(id) && playerById(id).present) ? id : null);
        const used = new Set(lu.slots.filter(Boolean));
        const pool = presentPlayers().filter(p => !used.has(p.id)).sort(byNumberName);
        const take = (pred) => { const k = pool.findIndex(pred); return k >= 0 ? pool.splice(k, 1)[0].id : null; };
        layout.forEach((pos, i) => { if (!lu.slots[i]) lu.slots[i] = take(p => p.position === pos.role); });
        layout.forEach((pos, i) => {
            if (lu.slots[i]) return;
            lu.slots[i] = take(p => !p.position) ?? (pos.role === 'GK' ? take(() => true) : take(p => p.position !== 'GK') ?? take(() => true));
        });
        benchPick = null;
        persistLineup(n);
        renderLineupPage(); renderMatchPage();
    }

    function clearLineup() {
        if (!confirm(t('clear_confirm'))) return;
        const n = getFormat();
        lineups[n].slots = new Array(n).fill(null);
        benchPick = null;
        persistLineup(n);
        renderLineupPage(); renderMatchPage();
    }

    function setLineupStatus(key) {
        const el = document.getElementById('lineupStatus');
        el.textContent = key ? t(key) : '';
        el.style.color = key === 'save_failed' ? 'var(--danger)' : 'var(--primary)';
    }

    function persistLineup(n) {
        setLineupStatus('saving');
        clearTimeout(lineupSaveTimers[n]);
        lineupSaveTimers[n] = setTimeout(async () => {
            const value = JSON.stringify(lineups[n]);
            try {
                await api('save_setting', { key: 'lineup_' + n, value });
                settings['lineup_' + n] = value;
                setLineupStatus('saved');
            } catch (e) {
                setLineupStatus('save_failed');
                showToast(t('save_error'));
            }
        }, 500);
    }

    // =====================================================================
    // 3. ئامادەکرنا یارییێ
    // =====================================================================
    function renderMatchPage() {
        document.getElementById('liveDot').classList.toggle('on', !!live);
        document.getElementById('matchSetup').style.display = live ? 'none' : 'block';
        document.getElementById('matchLive').style.display = live ? 'block' : 'none';
        if (live) { renderLive(); return; }

        const tn = document.getElementById('setupTeamName');
        if (!setupTouched && document.activeElement !== tn) tn.value = teamName();

        const opps = [...new Set(matches.map(m => m.details && m.details.opponent_name).filter(Boolean))];
        document.getElementById('oppNamesList').innerHTML = opps.map(o => `<option value="${esc(o)}"></option>`).join('');

        document.getElementById('formatSegSetup').innerHTML = formatSegHTML();

        const dur = document.getElementById('setupDuration');
        if (!dur.value) dur.value = parseInt(settings.duration, 10) || 60;
        renderDurationChips();

        const n = getFormat();
        const lu = curLineup();
        const slots = lu.slots.map(id => (id && playerById(id) && playerById(id).present) ? id : null);
        document.getElementById('setupLineupCount').textContent = `${lu.formation} · ${slots.filter(Boolean).length}/${n}`;
        document.getElementById('setupPitch').innerHTML = pitchHTML(lu.formation, lu.slots, 'preview', captainId());
        const absentIn = lu.slots.filter(Boolean).map(playerById).filter(p => p && !p.present);
        document.getElementById('setupWarn').innerHTML = absentIn.length
            ? `<div class="warn-box">${esc(t('absent_in_lineup', { names: absentIn.map(p => p.name).join('، ') }))}</div>` : '';
    }

    function renderDurationChips() {
        const v = parseInt(document.getElementById('setupDuration').value, 10);
        document.getElementById('durationChips').innerHTML = DURATIONS.map(d =>
            `<button class="chip-btn ${v === d ? 'on' : ''}" onclick="setDuration(${d})">${d}</button>`).join('');
    }

    function setDuration(d) {
        document.getElementById('setupDuration').value = d;
        renderDurationChips();
    }

    function parseOppPlayers(text) {
        return text.split(/[\n,،]+/).map(s => s.trim()).filter(Boolean).slice(0, 30);
    }

    function startMatch() {
        const n = getFormat();
        const lu = curLineup();
        const slots = lu.slots.map(id => (id && playerById(id) && playerById(id).present) ? id : null);
        const filled = slots.filter(Boolean).length;
        if (filled === 0) return showToast(t('need_one'));
        if (filled < n && !confirm(t('incomplete_confirm', { f: filled, n }))) return;

        const ourName = document.getElementById('setupTeamName').value.trim() || teamName();
        const oppName = document.getElementById('setupOppName').value.trim() || t('opp_default');
        let durMin = parseInt(document.getElementById('setupDuration').value, 10);
        if (!Number.isFinite(durMin) || durMin < 1) durMin = 60;
        durMin = Math.min(durMin, 180);
        const cap = captainId();

        const squad = {};
        presentPlayers().forEach(p => {
            const started = slots.includes(p.id);
            squad[p.id] = {
                id: p.id, name: p.name, number: p.number, position: p.position || '',
                started, appeared: started, onSince: started ? 0 : null, played: 0, goals: 0
            };
        });

        live = {
            v: 2,
            teamName: ourName,
            oppName,
            oppPlayers: parseOppPlayers(document.getElementById('setupOppPlayers').value),
            format: n,
            formation: lu.formation,
            duration: durMin * 60,
            remaining: durMin * 60,
            isRunning: true,
            endTime: Date.now() + durMin * 60 * 1000,
            timeUpShown: false,
            captainId: cap && squad[cap] ? cap : null,
            startSlots: slots.slice(),
            slots: slots.slice(),
            players: squad,
            goals: [],
            subs: [],
            startedAt: new Date().toISOString()
        };
        saveLive();

        // پاراستنا ناڤێ تیمی و دەمی بۆ جارا بهێت
        if (ourName !== (settings.team_name || '')) {
            settings.team_name = ourName;
            api('save_setting', { key: 'team_name', value: ourName }).catch(() => {});
        }
        if (String(durMin) !== String(settings.duration || '')) {
            settings.duration = String(durMin);
            api('save_setting', { key: 'duration', value: String(durMin) }).catch(() => {});
        }
        setupTouched = false;
        document.getElementById('setupOppName').value = '';
        document.getElementById('setupOppPlayers').value = '';

        startTimerInterval();
        requestWakeLock();
        renderAll();
        switchPage('match');
        showToast(t('match_started'));
    }

    // =====================================================================
    // 4. یارییا ڕاستەوخۆ: دەمژمێر، گۆل، گوهۆڕین
    // =====================================================================
    function saveLive() { if (live) lsSet(LIVE_KEY, JSON.stringify(live)); }
    function elapsed() { return live ? Math.max(0, live.duration - live.remaining) : 0; }
    function playerSeconds(lp) { return (lp.played || 0) + (lp.onSince != null ? Math.max(0, elapsed() - lp.onSince) : 0); }
    function fmtMin(sec) { return Math.floor(sec / 60) + "'"; }
    function minuteNow() { return Math.max(1, Math.ceil(elapsed() / 60)); }
    function scoreOf(team) { return live.goals.filter(g => g.team === team).length; }

    function syncRemaining() {
        if (!live || !live.isRunning || !live.endTime) return;
        const left = Math.max(0, Math.ceil((live.endTime - Date.now()) / 1000));
        live.remaining = left;
        if (left === 0) {
            live.isRunning = false;
            live.endTime = null;
            clearInterval(timerInterval);
            saveLive();
            onTimeUp();
            return;
        }
        saveLive();
    }

    function startTimerInterval() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!live || !live.isRunning) { clearInterval(timerInterval); return; }
            syncRemaining();
            updateTimerDisplay();
            updateMinuteLabels();
        }, 1000);
    }

    function onTimeUp() {
        vibrate([300, 150, 300]);
        releaseWakeLock();
        updateTimerDisplay();
        updateMinuteLabels();
        if (!live.timeUpShown) {
            live.timeUpShown = true;
            saveLive();
            openFinishSheet(true);
        }
    }

    function updateTimerDisplay() {
        if (!live) return;
        const r = live.remaining;
        const el = document.getElementById('timerDisplay');
        el.textContent = `${String(Math.floor(r / 60)).padStart(2, '0')}:${String(r % 60).padStart(2, '0')}`;
        el.classList.toggle('over', r === 0);
        document.getElementById('elapsedLbl').textContent = t('minute_n', { m: Math.floor(elapsed() / 60) }) + "'";
        document.getElementById('timerToggleBtn').textContent = live.isRunning ? t('pause') : t('resume');
    }

    function updateMinuteLabels() {
        if (!live) return;
        document.querySelectorAll('[data-min]').forEach(el => {
            const lp = live.players[el.dataset.min];
            if (lp) el.textContent = fmtMin(playerSeconds(lp));
        });
    }

    function toggleTimer() {
        if (!live) return;
        if (live.isRunning) {
            syncRemaining();
            if (!live.isRunning) return;
            clearInterval(timerInterval);
            live.isRunning = false;
            live.endTime = null;
            releaseWakeLock();
        } else {
            if (live.remaining <= 0) return addExtraTime(true);
            live.isRunning = true;
            live.endTime = Date.now() + live.remaining * 1000;
            startTimerInterval();
            requestWakeLock();
        }
        saveLive();
        updateTimerDisplay();
    }

    function addExtraTime(resume) {
        if (!live) return;
        syncRemaining();
        live.duration += 300;
        live.remaining += 300;
        live.timeUpShown = false;
        if (live.isRunning) {
            live.endTime += 300000;
        } else if (resume) {
            live.isRunning = true;
            live.endTime = Date.now() + live.remaining * 1000;
            startTimerInterval();
            requestWakeLock();
        }
        saveLive();
        closeSheet();
        updateTimerDisplay();
        updateMinuteLabels();
    }

    function renderLive() {
        if (!live) return;
        document.getElementById('liveNameA').textContent = live.teamName;
        document.getElementById('liveNameB').textContent = live.oppName;
        document.getElementById('liveScoreA').textContent = scoreOf('A');
        document.getElementById('liveScoreB').textContent = scoreOf('B');
        document.getElementById('liveFormation').textContent = `${live.format} × ${live.format} · ${live.formation}`;
        updateTimerDisplay();

        document.getElementById('livePitch').innerHTML = pitchHTML(live.formation, live.slots, 'live', live.captainId);

        const bench = liveBench();
        document.getElementById('liveBench').innerHTML = bench.length ? bench.map(lp => `
            <button class="bench-chip" onclick="onLiveBench(${lp.id})">
                ${numText(lp) ? `<span class="n">${esc(numText(lp))}</span>` : ''} ${esc(lp.name)}
                ${lp.appeared ? `<span class="m" data-min="${lp.id}">${fmtMin(playerSeconds(lp))}</span>` : ''}
            </button>`).join('') : `<div class="empty-text" style="width:100%">${esc(t('no_bench'))}</div>`;

        const goalsEl = document.getElementById('liveGoalsList');
        goalsEl.innerHTML = live.goals.length ? live.goals.map((g, idx) => `
            <div class="feed-item ${g.team === 'A' ? 'a' : 'b'}">
                <span><span class="minute">${g.minute}'</span> ⚽ <b>${esc(goalLabel(g))}</b> <span class="muted">(${esc(g.team === 'A' ? live.teamName : live.oppName)})</span></span>
                <button class="icon-btn del-btn" onclick="undoGoal(${idx})">×</button>
            </div>`).reverse().join('') : `<div class="empty-text">${esc(t('no_goals'))}</div>`;

        const subsEl = document.getElementById('liveSubsList');
        subsEl.innerHTML = live.subs.length ? live.subs.map(s => {
            const pin = live.players[s.in], pout = s.out ? live.players[s.out] : null;
            return `<div class="feed-item s"><span><span class="minute">${s.minute}'</span> 🟢 ${esc(pin ? pin.name : '?')} ${pout ? `⬅️ 🔴 ${esc(pout.name)}` : ''}</span></div>`;
        }).reverse().join('') : `<div class="empty-text">${esc(t('no_subs'))}</div>`;
    }

    function liveBench() {
        const on = new Set(live.slots.filter(Boolean));
        return Object.values(live.players).filter(lp => !on.has(lp.id))
            .sort((a, b) => roleOrder(a.position) - roleOrder(b.position) || byNumberName(a, b));
    }

    function goalLabel(g) {
        if (g.og) return t('own_goal');
        if (g.name) return (g.team === 'B' && g.number != null ? '#' + g.number + ' ' : '') + g.name;
        if (g.number != null) return '#' + g.number;
        return t('unknown');
    }

    // --- گۆل ---
    function openGoalSheet(team) {
        if (!live) return;
        const teamTitle = team === 'A' ? live.teamName : live.oppName;
        let html = '';
        if (team === 'A') {
            const onField = live.slots.filter(Boolean).map(id => live.players[id]);
            html += '<div class="pick-grid">' + onField.map(lp => `
                <button class="pick-btn" onclick="recordGoalA(${lp.id})">
                    <span class="pn">${esc(lp.name)}</span><small>${numText(lp) ? '#' + esc(numText(lp)) + ' · ' : ''}${esc(roleLabel(lp.position))}</small>
                </button>`).join('') + '</div>';
            const bench = liveBench().filter(lp => lp.appeared);
            if (bench.length) {
                html += `<div class="sheet-section">${esc(t('bench_players'))}</div><div class="pick-grid">` + bench.map(lp => `
                    <button class="pick-btn" onclick="recordGoalA(${lp.id})"><span class="pn">${esc(lp.name)}</span></button>`).join('') + '</div>';
            }
        } else if (live.oppPlayers.length) {
            html += '<div class="pick-grid">' + live.oppPlayers.map((name, i) => `
                <button class="pick-btn" onclick="recordGoalB({idx:${i}})"><span class="pn">${esc(name)}</span></button>`).join('') + '</div>';
        } else {
            html += `<div class="sheet-section">${esc(t('player_number'))}</div><div class="pick-grid nums">`;
            for (let i = 1; i <= Math.max(live.format, 8); i++) {
                html += `<button class="pick-btn" onclick="recordGoalB({number:${i}})"><b style="font-size:1.2rem">${i}</b></button>`;
            }
            html += `</div>
                <div class="input-group">
                    <input type="number" id="oppCustomNumber" inputmode="numeric" min="0" max="999" placeholder="${esc(t('other_number'))}">
                    <button class="btn-secondary btn-fit" onclick="recordGoalBCustom()">${esc(t('ok'))}</button>
                </div>`;
        }
        html += `<div class="btn-row">
            <button class="btn-ghost" onclick="recordOwnGoal('${team}')">${esc(t('own_goal'))}</button>
            ${team === 'B' ? `<button class="btn-ghost" onclick="recordGoalB({})">${esc(t('unknown'))}</button>` : ''}
        </div>`;
        openSheet(t('who_scored', { team: teamTitle }), html);
    }

    function pushGoal(goal, toastName) {
        syncRemaining();
        goal.minute = minuteNow();
        live.goals.push(goal);
        saveLive();
        closeSheet();
        renderLive();
        vibrate(150);
        showToast(t('goal_toast', { name: toastName }));
    }

    function recordGoalA(pid) {
        const lp = live.players[pid];
        if (!lp) return;
        lp.goals = (lp.goals || 0) + 1;
        pushGoal({ team: 'A', pid: lp.id, name: lp.name, number: lp.number ?? null }, lp.name);
    }

    function recordGoalB(o) {
        const goal = { team: 'B' };
        if (o.idx != null) goal.name = live.oppPlayers[o.idx];
        if (o.number != null) goal.number = o.number;
        pushGoal(goal, goalLabel(goal));
    }

    function recordGoalBCustom() {
        const n = readNumber(document.getElementById('oppCustomNumber').value);
        if (n == null) return;
        recordGoalB({ number: n });
    }

    function recordOwnGoal(team) {
        pushGoal({ team, og: true }, t('own_goal'));
    }

    function undoGoal(idx) {
        const g = live.goals[idx];
        if (!g) return;
        if (g.team === 'A' && g.pid && live.players[g.pid]) {
            live.players[g.pid].goals = Math.max(0, (live.players[g.pid].goals || 0) - 1);
        }
        live.goals.splice(idx, 1);
        saveLive();
        renderLive();
    }

    // --- گوهۆڕین ---
    function onLiveSlot(i) {
        const pid = live.slots[i];
        if (!pid) return openInPicker(i);
        const lp = live.players[pid];
        openSheet(lp.name, `
            <div class="player-head">
                <span class="num-badge big-num">${esc(shirtText(lp))}</span>
                <div>
                    <div style="font-weight:bold">${esc(lp.name)} ${live.captainId === lp.id ? capMark() : ''}</div>
                    <div class="muted">${esc(roleLabel(lp.position))} · ⏱️ ${fmtMin(playerSeconds(lp))} · ⚽ ${lp.goals || 0}</div>
                </div>
            </div>
            <button class="btn-primary btn-big" onclick="recordGoalA(${lp.id})">${esc(t('record_goal'))}</button>
            <button class="btn-secondary mt" onclick="openInPicker(${i})">${esc(t('sub_out'))}</button>
        `);
    }

    function openSubFlow() {
        const html = live.slots.map((pid, i) => ({ pid, i })).filter(x => x.pid).map(({ pid, i }) => {
            const lp = live.players[pid];
            return `<button class="pick-row" onclick="openInPicker(${i})">
                <span class="num-badge">${esc(shirtText(lp))}</span><span class="pname">${esc(lp.name)}</span>
                <span class="tag" style="direction:ltr">${fmtMin(playerSeconds(lp))}</span>${roleChip(lp.position)}
            </button>`;
        }).join('');
        const layout = slotLayout(live.formation);
        const empties = live.slots.map((pid, i) => ({ pid, i })).filter(x => !x.pid).map(({ i }) => `
            <button class="pick-row" onclick="openInPicker(${i})"><span class="num-badge">+</span><span class="pname">${esc(t('empty_slot_n', { role: roleLabel(layout[i].role) }))}</span></button>`).join('');
        openSheet(t('who_out'), (html || empties) ? `<div class="pick-list">${html}${empties}</div>` : `<div class="empty-text">${esc(t('no_field'))}</div>`);
    }

    function openInPicker(slotIdx) {
        const bench = liveBench();
        const outPid = live.slots[slotIdx];
        const layout = slotLayout(live.formation);
        const title = outPid ? t('who_in', { name: live.players[outPid].name }) : t('empty_slot_n', { role: roleLabel(layout[slotIdx].role) });
        if (!bench.length) { closeSheet(); return showToast(t('no_bench')); }
        const role = layout[slotIdx].role;
        bench.sort((a, b) => (a.position === role ? 0 : 1) - (b.position === role ? 0 : 1));
        openSheet(title, '<div class="pick-list">' + bench.map(lp => `
            <button class="pick-row" onclick="doSub(${slotIdx}, ${lp.id})">
                <span class="num-badge">${esc(shirtText(lp))}</span><span class="pname">${esc(lp.name)}</span>
                ${lp.appeared ? `<span class="tag" style="direction:ltr">${fmtMin(playerSeconds(lp))}</span>` : ''}${roleChip(lp.position)}
            </button>`).join('') + '</div>');
    }

    function onLiveBench(pid) {
        const lp = live.players[pid];
        const layout = slotLayout(live.formation);
        const rows = live.slots.map((id, i) => {
            if (!id) return `<button class="pick-row" onclick="doSub(${i}, ${pid})"><span class="num-badge">+</span><span class="pname">${esc(t('empty_slot_n', { role: roleLabel(layout[i].role) }))}</span></button>`;
            const op = live.players[id];
            return `<button class="pick-row" onclick="doSub(${i}, ${pid})">
                <span class="num-badge">${esc(shirtText(op))}</span><span class="pname">${esc(op.name)}</span>
                <span class="tag" style="direction:ltr">${fmtMin(playerSeconds(op))}</span>${roleChip(layout[i].role)}
            </button>`;
        }).join('');
        openSheet(t('who_replace', { name: lp.name }), `<div class="pick-list">${rows}</div>`);
    }

    function doSub(slotIdx, inPid) {
        syncRemaining();
        const e = elapsed();
        const outPid = live.slots[slotIdx];
        const pin = live.players[inPid];
        if (!pin || live.slots.includes(inPid)) return closeSheet();
        if (e === 0) {
            // بەری دەستپێکرنێ: تنێ گوهۆڕینا پێکهاتێ
            if (outPid) { const po = live.players[outPid]; po.started = false; po.appeared = false; po.onSince = null; }
            pin.started = true; pin.appeared = true; pin.onSince = 0;
            live.startSlots[slotIdx] = inPid;
        } else {
            if (outPid) {
                const po = live.players[outPid];
                po.played = (po.played || 0) + Math.max(0, e - (po.onSince || 0));
                po.onSince = null;
            }
            pin.onSince = e;
            pin.appeared = true;
            live.subs.push({ minute: minuteNow(), out: outPid || null, in: inPid });
        }
        live.slots[slotIdx] = inPid;
        saveLive();
        closeSheet();
        renderLive();
        showToast(t('sub_toast', { in: pin.name, out: outPid ? live.players[outPid].name : '—' }));
    }

    // --- بداویهینان و پاراستن ---
    function resultKey(a, b) { return a > b ? 'win' : (a < b ? 'loss' : 'draw'); }

    function openFinishSheet(timeUp) {
        if (!live) return;
        const sa = scoreOf('A'), sb = scoreOf('B');
        const res = resultKey(sa, sb);
        const ps = Object.values(live.players).filter(lp => lp.appeared)
            .sort((a, b) => playerSeconds(b) - playerSeconds(a));
        const goals = live.goals.map(g => `
            <div class="feed-item ${g.team === 'A' ? 'a' : 'b'}"><span><span class="minute">${g.minute}'</span> ⚽ ${esc(goalLabel(g))}</span></div>`).join('');
        openSheet(timeUp ? t('time_up') : t('summary'), `
            <div class="mc-score" style="margin:6px 0 12px">
                <span class="tn a">${esc(live.teamName)}</span><span class="sc">${sa}</span><span>-</span><span class="sc">${sb}</span><span class="tn b">${esc(live.oppName)}</span>
            </div>
            <div style="text-align:center; margin-bottom:12px"><span class="res-badge res-${res}">${esc(t(res))}</span></div>
            ${goals ? `<div class="sheet-section">${esc(t('goals_title'))}</div>${goals}` : ''}
            <div class="sheet-section">${esc(t('minutes_played'))}</div>
            ${ps.map(lp => `<div class="mini-row"><span class="pname">${esc(lp.name)} ${live.captainId === lp.id ? capMark() : ''}</span>
                ${lp.goals ? `<span>⚽ ${lp.goals}</span>` : ''}<span class="v">${Math.round(playerSeconds(lp) / 60)}'</span></div>`).join('')}
            <button class="btn-primary btn-big mt" id="saveMatchBtn" onclick="saveMatch()">${esc(t('save_match'))}</button>
            ${timeUp ? `<button class="btn-ghost mt" onclick="addExtraTime(true)">${esc(t('extra_time'))}</button>` : ''}
        `);
    }

    async function saveMatch() {
        if (!live) return;
        const btn = document.getElementById('saveMatchBtn');
        if (btn) btn.disabled = true;
        syncRemaining();
        if (live.isRunning) {
            clearInterval(timerInterval);
            live.isRunning = false;
            live.endTime = null;
        }
        const e = elapsed();
        const teamA = Object.values(live.players).map(lp => ({
            id: lp.id, name: lp.name, number: lp.number ?? null, position: lp.position || '',
            captain: live.captainId === lp.id,
            started: !!lp.started, appeared: !!lp.appeared,
            minutes: Math.round(playerSeconds(lp) / 60), goals: lp.goals || 0
        })).sort((a, b) => (b.started - a.started) || (b.appeared - a.appeared) || (b.minutes - a.minutes));
        const nameOf = id => (id && live.players[id]) ? { id, name: live.players[id].name } : null;
        const payload = {
            teamA,
            teamB: live.oppPlayers,
            scoreA: scoreOf('A'),
            scoreB: scoreOf('B'),
            goals: live.goals,
            details: {
                v: 2,
                team_name: live.teamName,
                opponent_name: live.oppName,
                format: live.format,
                formation: live.formation,
                duration: Math.round(live.duration / 60),
                played_seconds: e,
                captain_id: live.captainId,
                start_slots: live.startSlots.map(nameOf),
                subs: live.subs.map(s => ({ minute: s.minute, out: nameOf(s.out), in: nameOf(s.in) })),
                started_at: live.startedAt
            }
        };
        try {
            const r = await api('save_match', payload);
            lsDel(LIVE_KEY);
            live = null;
            clearInterval(timerInterval);
            releaseWakeLock();
            closeSheet();
            expandedMatchId = r.id;
            await loadData();
            switchPage('history');
            showToast(t('match_saved'));
        } catch (err) {
            saveLive();
            updateTimerDisplay();
            if (btn) btn.disabled = false;
            showToast(t('save_error'));
        }
    }

    function cancelLiveMatch() {
        if (!confirm(t('confirm_cancel'))) return;
        clearInterval(timerInterval);
        releaseWakeLock();
        lsDel(LIVE_KEY);
        live = null;
        renderAll();
    }

    // --- ڕۆشن هێلانا شاشێ دەمێ یارییێ ---
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch (e) { wakeLock = null; }
    }
    function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && live) {
            syncRemaining();
            if (!live) return;
            updateTimerDisplay();
            updateMinuteLabels();
            if (live.isRunning) { startTimerInterval(); requestWakeLock(); }
        }
    });

    // =====================================================================
    // 5. مێژوو
    // =====================================================================
    function isV2(m) { return m.details && m.details.v === 2; }
    function matchDate(m) { return (m.played_at || '').split(' ')[0]; }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (!matches.length) {
            list.innerHTML = `<div class="empty-text" style="padding:20px">${esc(t('no_matches'))}</div>`;
            return;
        }
        list.innerHTML = matches.map(m => {
            const v2 = isV2(m);
            const nameA = v2 ? m.details.team_name : 'A';
            const nameB = v2 ? m.details.opponent_name : 'B';
            const res = v2 ? resultKey(m.score_a, m.score_b) : 'legacy';
            const open = expandedMatchId === m.id;
            return `
            <div class="match-card">
                <div class="mc-head" onclick="toggleMatch(${m.id})">
                    <div class="mc-meta">
                        <span>📅 ${esc(matchDate(m))}${v2 ? ` · ${m.details.format}×${m.details.format}` : ''}</span>
                        <span class="res-badge res-${res}">${esc(t(res))}</span>
                    </div>
                    <div class="mc-score">
                        <span class="tn a">${esc(nameA)}</span><span class="sc">${m.score_a}</span><span>-</span><span class="sc">${m.score_b}</span><span class="tn b">${esc(nameB)}</span>
                    </div>
                </div>
                ${open ? `<div class="mc-body">${v2 ? matchDetailsV2(m) : matchDetailsLegacy(m)}
                    <div class="btn-row">
                        <button class="btn-share btn-sm" style="flex:1" onclick="shareMatch(${m.id})">${esc(t('share'))}</button>
                        <button class="btn-sm del-btn" onclick="deleteMatch(${m.id})">${esc(t('delete'))}</button>
                    </div></div>` : ''}
            </div>`;
        }).join('');
    }

    function toggleMatch(id) {
        expandedMatchId = expandedMatchId === id ? null : id;
        renderHistory();
    }

    function goalsFeed(m, nameA, nameB) {
        if (!m.goals || !m.goals.length) return '';
        return `<div class="sheet-section">${esc(t('goals_title'))}</div>` + m.goals.map(g => `
            <div class="feed-item ${g.team === 'A' ? 'a' : 'b'}">
                <span><span class="minute">${g.minute}'</span> ⚽ <b>${esc(g.player || goalLabel(g))}</b> <span class="muted">(${esc(g.team === 'A' ? nameA : nameB)})</span></span>
            </div>`).join('');
    }

    function matchDetailsV2(m) {
        const d = m.details;
        const starters = (m.team_a || []).filter(p => p.started);
        const subsUsed = (m.team_a || []).filter(p => !p.started && p.appeared);
        const row = p => `<div class="mini-row">
            <span class="num-badge" style="min-width:26px;height:26px;font-size:0.72rem">${esc(p.number != null ? p.number : '–')}</span>
            <span class="pname">${esc(p.name)} ${p.captain ? capMark() : ''}</span>
            ${p.goals ? `<span>⚽ ${p.goals}</span>` : ''}
            <span class="v">${p.minutes}'</span>
        </div>`;
        let html = goalsFeed(m, d.team_name, d.opponent_name);
        html += `<div class="sheet-section">${esc(t('starters'))} <span style="direction:ltr; display:inline-block">(${esc(d.formation || '')})</span></div>` + starters.map(row).join('');
        if (subsUsed.length) html += `<div class="sheet-section">${esc(t('subs_used'))}</div>` + subsUsed.map(row).join('');
        if (d.subs && d.subs.length) {
            html += `<div class="sheet-section">${esc(t('subs_title'))}</div>` + d.subs.map(s => `
                <div class="feed-item s"><span><span class="minute">${s.minute}'</span> 🟢 ${esc(s.in ? s.in.name : '?')} ${s.out ? `⬅️ 🔴 ${esc(s.out.name)}` : ''}</span></div>`).join('');
        }
        if (m.team_b && m.team_b.length) {
            html += `<div class="sheet-section">${esc(d.opponent_name)}</div><div class="muted" style="line-height:1.7">${m.team_b.map(esc).join('، ')}</div>`;
        }
        return html;
    }

    function matchDetailsLegacy(m) {
        let html = goalsFeed(m, 'A', 'B');
        html += `<div class="sheet-section">A</div><div class="muted" style="line-height:1.7">${(m.team_a || []).map(p => esc(p.name)).join('، ')}</div>`;
        html += `<div class="sheet-section">B</div><div class="muted" style="line-height:1.7">${(m.team_b || []).map(p => esc(p.name)).join('، ')}</div>`;
        return html;
    }

    async function deleteMatch(id) {
        if (!confirm(t('confirm_delete_match'))) return;
        try {
            await api('delete_match', { id });
            await loadData();
            showToast(t('match_deleted'));
        } catch (e) { showToast(t('save_error')); }
    }

    function shareMatch(id) {
        const m = matches.find(x => x.id === id);
        if (!m) return;
        const v2 = isV2(m);
        const d = m.details || {};
        const nameA = v2 ? d.team_name : 'A';
        const nameB = v2 ? d.opponent_name : 'B';
        let text = `⚽ *${t('report_title')}* (${matchDate(m)})\n━━━━━━━━━━━━━━\n`;
        text += `🏆 *${nameA}* ${m.score_a} - ${m.score_b} *${nameB}*`;
        if (v2) text += ` (${t(resultKey(m.score_a, m.score_b))})`;
        text += `\n━━━━━━━━━━━━━━\n`;
        if (m.goals && m.goals.length) {
            text += `\n🔥 *${t('goals_title')}:*\n`;
            m.goals.forEach(g => { text += `• ${g.minute}' ${g.player || goalLabel(g)} (${g.team === 'A' ? nameA : nameB})\n`; });
        }
        if (v2) {
            const starters = (m.team_a || []).filter(p => p.started);
            const subsUsed = (m.team_a || []).filter(p => !p.started && p.appeared);
            const fmt = p => `${p.name}${p.captain ? ' (C)' : ''} ${p.minutes}'${p.goals ? ' ⚽' + (p.goals > 1 ? p.goals : '') : ''}`;
            text += `\n🟢 *${t('starters')} (${d.formation}):*\n` + starters.map(p => '• ' + fmt(p)).join('\n') + '\n';
            if (subsUsed.length) text += `\n🔄 *${t('subs_used')}:*\n` + subsUsed.map(p => '• ' + fmt(p)).join('\n') + '\n';
            if (d.subs && d.subs.length) {
                text += `\n🔁 *${t('subs_title')}:*\n` + d.subs.map(s => `• ${s.minute}' ${s.in ? s.in.name : '?'}${s.out ? ' ⬅️ ' + s.out.name : ''}`).join('\n') + '\n';
            }
        } else {
            text += `\n🟢 *A:* ` + (m.team_a || []).map(p => p.name).join('، ');
            text += `\n🔵 *B:* ` + (m.team_b || []).map(p => p.name).join('، ');
        }
        if (navigator.share) {
            navigator.share({ title: t('report_title'), text }).catch(() => {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => showToast(t('report_copied')));
        }
    }

    // =====================================================================
    // 6. ئامار
    // =====================================================================
    function computeStats() {
        const rec = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
        const per = {};
        const nameToId = {};
        players.forEach(p => { nameToId[p.name.trim()] = p.id; });
        const entry = (key, name) => (per[key] = per[key] || { name, apps: 0, minutes: 0, goals: 0 });
        const keyForId = id => 'id:' + id;
        const displayName = (id, fallback) => { const p = playerById(id); return p ? p.name : fallback; };

        matches.forEach(m => {
            if (isV2(m)) {
                rec.p++;
                rec.gf += m.score_a; rec.ga += m.score_b;
                const r = resultKey(m.score_a, m.score_b);
                if (r === 'win') rec.w++; else if (r === 'draw') rec.d++; else rec.l++;
                (m.team_a || []).forEach(p => {
                    if (!p.appeared && !p.minutes) return;
                    const e = entry(keyForId(p.id), displayName(p.id, p.name));
                    e.apps++;
                    e.minutes += p.minutes || 0;
                });
                (m.goals || []).forEach(g => {
                    if (g.team !== 'A' || g.og || !g.pid) return;
                    entry(keyForId(g.pid), displayName(g.pid, g.name)).goals++;
                });
            } else {
                // یارییێن کەڤن (A - B): هەردوو تیم ژ یاریزانێن مە بوون
                (m.goals || []).forEach(g => {
                    if (!g.player) return;
                    const id = nameToId[String(g.player).trim()];
                    const key = id ? keyForId(id) : 'n:' + g.player;
                    entry(key, id ? displayName(id, g.player) : g.player).goals++;
                });
            }
        });
        return { rec, per: Object.values(per) };
    }

    function renderStats() {
        const { rec, per } = computeStats();
        const box = (v, label, color) => `<div class="rec-box"><b style="${color ? 'color:' + color : ''}">${v}</b><span>${esc(label)}</span></div>`;
        document.getElementById('recordGrid').innerHTML =
            box(rec.p, t('played')) + box(rec.w, t('win'), 'var(--primary)') + box(rec.d, t('draw'), 'var(--warning)') +
            box(rec.l, t('loss'), 'var(--danger)') + box(rec.gf, t('goals_for'), 'var(--primary)') + box(rec.ga, t('goals_against'), 'var(--danger)');

        const scorers = per.filter(p => p.goals > 0).sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
        document.getElementById('scorersList').innerHTML = scorers.length ? scorers.map((p, i) => `
            <div class="player-item">
                <div class="player-info" style="cursor:default">
                    <span class="num-badge" style="${i === 0 ? 'background:var(--warning);color:#000;border-color:var(--warning)' : ''}">${i + 1}</span>
                    <b class="pname">${esc(p.name)}</b>
                </div>
                <span style="font-weight:bold; color:var(--primary)">⚽ ${p.goals}</span>
            </div>`).join('') : `<div class="empty-text">${esc(t('no_stats'))}</div>`;

        const table = per.filter(p => p.apps > 0).sort((a, b) => b.apps - a.apps || b.minutes - a.minutes || b.goals - a.goals);
        document.getElementById('playerStatsTable').innerHTML = table.length ? `
            <table class="stats-table">
                <tr><th></th><th>${esc(t('apps'))}</th><th>${esc(t('mins'))}</th><th>${esc(t('goals_word'))}</th></tr>
                ${table.map(p => `<tr><td>${esc(p.name)}</td><td>${p.apps}</td><td>${p.minutes}</td><td>${p.goals}</td></tr>`).join('')}
            </table>` : `<div class="empty-text">${esc(t('no_stats'))}</div>`;
    }
</script>
